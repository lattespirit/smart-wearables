apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sw.fullname" . }}-secret
  labels: {{- include "sw.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ .Values.secrets.appKey | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.storage.key | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.secret | quote }}
  WECHAT_APP_ID: {{ .Values.wechat.app_id | quote }}
  WECHAT_APP_SECRET: {{ .Values.wechat.app_secret | quote }}
