# kind 本地集群配置（本地与生产统一 k8s）
# 用法：kind create cluster --config infrastructure/kind/config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # 将宿主机端口映射到集群 ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
